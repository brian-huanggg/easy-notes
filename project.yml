name: EasyNotes
options:
  bundleIdPrefix: app.easynotes
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  # 介面只有繁體中文；系統內建選單（檔案、編輯、顯示方式、視窗、輔助說明）也跟著用中文
  developmentLanguage: zh-Hant

packages:
  EasyNotesCore:
    path: Packages/EasyNotesCore
  # 外掛：只依賴 EasyNotesCore / EasyNotesUI，彼此不 import；App 負責組裝
  KindMarkdown:
    path: Packages/KindMarkdown
  KindWhiteboard:
    path: Packages/KindWhiteboard
  KindPDF:
    path: Packages/KindPDF
  KindSheet:
    path: Packages/KindSheet
  Flashcards:
    path: Packages/Flashcards
  # SyncBackend 的 Supabase 實作（不是外掛）
  SupabaseSync:
    path: Packages/SupabaseSync
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  EasyNotes:
    type: application
    supportedDestinations: [iOS, macOS]
    # 產生共用 scheme：scripts/ 的 xcodebuild 用 -scheme EasyNotes，不能依賴 Xcode 自動建立的使用者 scheme
    # ⌘U / scripts/test-e2e.sh 跑 E2E（XCUITest）
    scheme:
      testTargets: [EasyNotesE2ETests]
    sources:
      - path: App
    dependencies:
      - package: EasyNotesCore
        product: EasyNotesCore
      - package: EasyNotesCore
        product: EasyNotesUI
      - package: KindMarkdown
      - package: KindWhiteboard
      - package: KindPDF
      - package: KindSheet
      - package: Flashcards
      - package: SupabaseSync
      - package: Supabase
        product: Supabase
      # E2E 的資料夾同步 backend；App 只在 DEBUG 的測試模式 import（見 App/Support/TestHooks.swift）
      - package: EasyNotesCore
        product: EasyNotesTestSupport
    entitlements:
      path: App/EasyNotes.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: EasyNotes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [zh-Hant, en]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iOS「檔案」App 可看到 Vault
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        LSApplicationCategoryType: public.app-category.productivity
        # 只用 HTTPS（系統加密），屬豁免；TestFlight 不再每版詢問出口合規
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.easynotes.EasyNotes
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SF553X26YR # Brian Huang（個人團隊）
        # Prototype：macOS 不開沙盒，Vault 直接放在 ~/Documents/EasyNotes
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_PREVIEWS: YES

  # E2E：XCUITest 從外部操作 App（macOS、iPad 模擬器），並直接讀寫測試用的暫存 Vault 驗證「檔案即真相」。
  # 放在 Tests/E2E（check-l10n.py 略過 Tests/，測試資料可以寫中文）；跑法見 scripts/test-e2e.sh
  EasyNotesE2ETests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/E2E
      # 與 App 共用啟動參數與 accessibility identifier
      - path: App/Support/UITestContract.swift
    dependencies:
      - target: EasyNotes
      # 測試程序扮演另一台裝置：自己的 VaultFS + SyncEngine + 資料夾 backend
      - package: EasyNotesCore
        product: EasyNotesCore
      - package: EasyNotesCore
        product: EasyNotesTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.easynotes.EasyNotesE2ETests
        TEST_TARGET_NAME: EasyNotes
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SF553X26YR
        ENABLE_APP_SANDBOX: NO
