name: EasyNotes
options:
  bundleIdPrefix: app.easynotes
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  # 介面只有繁體中文；系統內建選單（檔案、編輯、顯示方式、視窗、輔助說明）也跟著用中文
  developmentLanguage: zh-Hant

packages:
  EasyNotesCore:
    path: Packages/EasyNotesCore
  # 外掛：只依賴 EasyNotesCore / EasyNotesUI，彼此不 import；App 負責組裝
  KindMarkdown:
    path: Packages/KindMarkdown
  KindWhiteboard:
    path: Packages/KindWhiteboard
  Flashcards:
    path: Packages/Flashcards
  # SyncBackend 的 Supabase 實作（不是外掛）
  SupabaseSync:
    path: Packages/SupabaseSync
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  EasyNotes:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: EasyNotesCore
        product: EasyNotesCore
      - package: EasyNotesCore
        product: EasyNotesUI
      - package: KindMarkdown
      - package: KindWhiteboard
      - package: Flashcards
      - package: SupabaseSync
      - package: Supabase
        product: Supabase
    entitlements:
      path: App/EasyNotes.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: EasyNotes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations: [zh-Hant]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iOS「檔案」App 可看到 Vault
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        LSApplicationCategoryType: public.app-category.productivity
        # 只用 HTTPS（系統加密），屬豁免；TestFlight 不再每版詢問出口合規
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.easynotes.EasyNotes
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SF553X26YR # Brian Huang（個人團隊）
        # Prototype：macOS 不開沙盒，Vault 直接放在 ~/Documents/EasyNotes
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_PREVIEWS: YES
