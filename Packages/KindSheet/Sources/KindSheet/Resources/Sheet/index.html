<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src vault: embed: symbol: data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
<style>
  /* 顏色與字型的 CSS variables 由 Swift 在頁面載入前注入（ThemeCSS.stylesheet()）；
     RevoGrid 的主題（compact / darkCompact）由 sheet.js 依 prefers-color-scheme 切換 */
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: var(--bg-canvas); }
  body { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  /* 工具列、編輯列在上，狀態列在下，表格佔其餘空間 */
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; font-family: var(--font-ui); color: var(--text-body); }
  #sheet { flex: 1; min-height: 0; position: relative; }

  #toolbar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); background: var(--bg-panel); }
  #toolbar::-webkit-scrollbar { display: none; }
  .sheet-tool-group { display: flex; gap: 2px; padding-right: 6px; border-right: 1px solid var(--border); }
  .sheet-tool-group:last-child { border-right: 0; }
  .sheet-tool { display: grid; place-items: center; width: 30px; height: 28px; padding: 0; border: 0; border-radius: var(--radius-sm, 6px); background: transparent; color: var(--text-secondary); cursor: default; }
  .sheet-tool:hover:not(:disabled) { background: var(--bg-hover); }
  .sheet-tool:disabled { opacity: 0.35; }
  .sheet-tool.is-active { background: var(--accent-soft); color: var(--accent); }
  .sheet-icon { display: block; width: 16px; height: 16px; background: currentColor; -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }

  #formula { display: flex; align-items: flex-start; gap: 8px; padding: 4px 10px; border-bottom: 1px solid var(--border); background: var(--bg-canvas); }
  .sheet-name { flex: none; min-width: 64px; height: 24px; padding: 0 8px; line-height: 24px; box-sizing: border-box; border-right: 1px solid var(--border); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-secondary); white-space: nowrap; }
  .sheet-fx { flex: none; margin-top: 4px; color: var(--text-tertiary); }
  .sheet-formula { flex: 1; min-width: 0; height: 24px; max-height: calc(6 * 18px + 6px); margin: 0; padding: 3px 4px; box-sizing: border-box; border: 0; outline: none; resize: none; overflow: hidden; background: transparent; color: var(--text-body); font: 13px/18px var(--font-ui); white-space: pre-wrap; }
  .sheet-formula:focus { overflow-y: auto; border-radius: var(--radius-sm, 6px); box-shadow: 0 0 0 1px var(--accent); }
  .sheet-formula:disabled { color: var(--text-tertiary); }

  #status { display: flex; justify-content: space-between; gap: 16px; padding: 4px 12px; border-top: 1px solid var(--border); background: var(--bg-panel); font-size: 11.5px; line-height: 16px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sheet-status-selection { display: flex; gap: 14px; overflow: hidden; }
  revo-grid { height: 100%; font-family: var(--font-ui); font-size: 13px; color: var(--text-body); }
  revo-grid[theme] { --revo-grid-background: var(--bg-canvas); --revo-grid-foreground: var(--text-body); }
  /* 標題列（檔案第一列）固定在上方，加粗 */
  revo-grid revogr-data[type="rowPinStart"] .rgCell { font-weight: 600; color: var(--text-primary); }
  revo-grid .rgHeaderCell, revo-grid .rowHeaders .rgCell { color: var(--text-tertiary); }
  revo-grid revogr-focus { border-color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar"></div>
  <div id="formula"></div>
  <div id="sheet"></div>
  <div id="status"></div>
</div>
<script src="sheet.js"></script>
</body>
</html>
