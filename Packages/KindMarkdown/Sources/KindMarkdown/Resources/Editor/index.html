<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --text: #1d1d1f;
    --muted: #86868b;
    --accent: #b8860b;
    --link: #0a64d8;
    --code-bg: rgba(0, 0, 0, 0.05);
    --quote: rgba(0, 0, 0, 0.15);
    --bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #f5f5f7;
      --muted: #8e8e93;
      --accent: #ffcc4d;
      --link: #4ea1ff;
      --code-bg: rgba(255, 255, 255, 0.08);
      --quote: rgba(255, 255, 255, 0.2);
      --bg: #1c1c1e;
    }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  /* 停用 iOS 長按選單、雙擊放大等會干擾編輯的手勢 */
  body { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #editor { height: 100%; }
  .cm-editor { height: 100%; color: var(--text); font-size: 17px; }
  /* CodeMirror 預設在 .cm-scroller 設 monospace，這裡改回系統字型 */
  .cm-editor .cm-scroller { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif; }
  .cm-editor.cm-focused { outline: none; }
  .cm-scroller { line-height: 1.6; padding: 24px max(20px, calc((100% - 720px) / 2)) 40vh; }
  .cm-content { caret-color: var(--accent); }
  .cm-cursor { border-left: 2px solid var(--accent) !important; }
  .cm-selectionBackground, .cm-focused .cm-selectionBackground { background: color-mix(in srgb, var(--accent) 25%, transparent) !important; }

  .cm-lp-h { font-weight: 700; line-height: 1.3; }
  .cm-lp-h1 { font-size: 1.75em; padding-top: 0.4em; }
  .cm-lp-h2 { font-size: 1.4em; padding-top: 0.3em; }
  .cm-lp-h3 { font-size: 1.2em; }
  .cm-lp-strong { font-weight: 700; }
  .cm-lp-em { font-style: italic; }
  .cm-lp-strike { text-decoration: line-through; color: var(--muted); }
  .cm-lp-code { font-family: ui-monospace, "SF Mono", monospace; font-size: 0.88em; background: var(--code-bg); border-radius: 4px; padding: 0 3px; }
  .cm-lp-codeblock { font-family: ui-monospace, "SF Mono", monospace; font-size: 0.88em; background: var(--code-bg); }
  .cm-lp-codeinfo { color: var(--muted); font-size: 0.8em; }
  .cm-lp-quote { border-left: 3px solid var(--quote); padding-left: 12px !important; color: var(--muted); }
  .cm-lp-link, .cm-lp-wikilink { color: var(--link); cursor: pointer; }
  .cm-lp-tag { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); border-radius: 5px; padding: 0 3px; cursor: pointer; }
  .cm-lp-url, .cm-lp-mark { color: var(--muted); }
  .cm-lp-bullet { color: var(--muted); display: inline-block; width: 0.8em; }
  .cm-lp-task { width: 1em; height: 1em; margin: 0 0.35em 0 0; vertical-align: -0.1em; accent-color: var(--accent); }
  /* [[ 自動完成 */
  .cm-tooltip.cm-tooltip-autocomplete { border: none; border-radius: 10px; overflow: hidden; background: var(--bg); box-shadow: 0 6px 24px rgba(0,0,0,0.18), 0 0 0 0.5px var(--quote); }
  .cm-editor .cm-tooltip.cm-tooltip-autocomplete > ul { font-family: -apple-system, "PingFang TC", sans-serif; font-size: 15px; max-height: 14em; }
  .cm-tooltip-autocomplete > ul > li { padding: 6px 12px !important; color: var(--text); }
  .cm-editor .cm-tooltip.cm-tooltip-autocomplete > ul > li[aria-selected] { background: color-mix(in srgb, var(--accent) 22%, transparent) !important; color: var(--text) !important; }
  .cm-editor .cm-completionMatchedText { text-decoration: none; font-weight: 700; color: var(--accent); }
</style>
</head>
<body>
<div id="editor"></div>
<script src="editor.js"></script>
</body>
</html>
